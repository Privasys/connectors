name: Publish

# Publishes the measured connector images to GHCR, the way the other platform
# apps do: GITHUB_TOKEN plus packages:write, no personal token.
#
# Each image is self-contained. The tool catalogue is passed in as a build
# argument read from the connector's privasys.json, so the image that reaches
# the registry is the one the control plane will learn the catalogue from.
#
# A push builds the connectors it touched: a change under <name>/ builds that
# connector, and one under sdk/ builds every connector, because the shell is
# part of what each image is measured to do. A manual run builds them all.
# Adding a connector is one name in CONNECTORS below and in the paths filter.
#
# Deploying to an enclave is a separate step: versions create, stage, promote
# and deploy through the management service. Promoting takes a human approval
# on a device, which is the point of it.

on:
  push:
    branches: [main]
    paths:
      - 'mail/**'
      - 'calendar/**'
      - 'files/**'
      - 'meetings/**'
      - 'sdk/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CONNECTORS: mail calendar files meetings

jobs:
  changes:
    name: Which connectors changed
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.which.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            changed="all"
          else
            changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "$changed"
          build=""
          for c in $CONNECTORS; do
            # A connector directory that exists in the tree; an unbuilt name in
            # the list is not an error, so the list can lead the code.
            [ -f "$c/Dockerfile" ] || continue
            case "$changed" in
              all|*sdk/*|*.github/workflows/publish.yml*) build="$build $c" ;;
              *"$c/"*) build="$build $c" ;;
            esac
          done
          list=$(printf '%s\n' $build | jq -R . | jq -sc .)
          echo "building: $list"
          echo "matrix=$list" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # The catalogue reaches the control plane as an image label, and it must
      # come from the one copy in privasys.json. Compacted and handed to buildx
      # straight from the shell: passed through a step output and an
      # expression, one quoted word of the calendar manifest lost its quotes
      # (2026-09-20) and the control plane learnt no tools at all.
      - id: build
        run: |
          C=${{ matrix.connector }}
          MANIFEST=$(jq -c . $C/privasys.json)
          docker buildx build --push \
            --file $C/Dockerfile \
            --build-arg "MANIFEST=$MANIFEST" \
            --tag ghcr.io/privasys/$C-connector:latest \
            --tag ghcr.io/privasys/$C-connector:${{ github.sha }} \
            --metadata-file /tmp/$C-metadata.json \
            .
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/$C-metadata.json)" >> "$GITHUB_OUTPUT"

      # The digest is the app's identity on the platform: a version is created
      # against image@digest, never a tag, because a tag can move under a
      # deployment and a digest cannot. The label is read back and parsed, so
      # a manifest that did not survive the trip fails here, not at deploy.
      - name: Report the digest and check the label
        run: |
          C=${{ matrix.connector }}
          echo "Deploy this exact image:"
          echo "  ghcr.io/privasys/$C-connector@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "ghcr.io/privasys/$C-connector@${{ steps.build.outputs.digest }}" \
            --format '{{ index .Image.Config.Labels "org.privasys.manifest" }}' | jq -e '.tools | length > 0' > /dev/null
