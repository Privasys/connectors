name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The sdk is its own module, Apache-2.0, and every connector builds against
  # the copy beside it. It is tested on its own so a change to the shell fails
  # here before it fails in a connector.
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: sdk/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

  # Every directory with a privasys.json is a connector. Found from the tree
  # rather than listed here, so adding a connector never edits this file and
  # two connectors added in the same week never fight over one line.
  discover:
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.list.outputs.connectors }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          list=$(ls -d */privasys.json | cut -d/ -f1 | jq -R . | jq -sc .)
          echo "connectors=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  connector:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        connector: ${{ fromJSON(needs.discover.outputs.connectors) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.connector }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: ${{ matrix.connector }}/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -count=1

      # The tool catalogue reaches the control plane as an image label. If a
      # tool is added to the manifest without a route, an agent gets a 404
      # from something the catalogue promised, so the two are checked against
      # each other rather than trusted to stay in step. `configure` is the
      # sdk's route and is not looked for here.
      - name: Manifest and routes agree
        run: |
          python3 - <<'PY'
          import json, sys, glob
          manifest = json.load(open("privasys.json"))
          src = "".join(open(f).read() for f in glob.glob("internal/api/*.go"))
          # Plain string scanning rather than regex: the escaping needed to put
          # a pattern with quotes and parens through YAML and a heredoc is how
          # a check quietly stops matching anything and passes forever.
          routed = set()
          for line in src.splitlines():
              for marker in ('s.tool(m, "', 'm.HandleFunc("'):
                  i = line.find(marker)
                  if i < 0:
                      continue
                  value = line[i + len(marker):].split('"')[0]
                  routed.add(value.split(" ")[-1])
          declared = {t["endpoint"] for t in manifest["tools"] if t.get("role") != "config"}
          missing = declared - routed
          if not routed:
              print("the check matched no routes at all, so it is broken")
              sys.exit(1)
          if missing:
              print("in the manifest but not routed:", sorted(missing))
          sys.exit(1 if missing else 0)
          PY

      - name: Image builds with its manifest
        run: ./build.sh
